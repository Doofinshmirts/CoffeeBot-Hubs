services:
  - type: web
    name: coffeebot-hubs
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: SUPABASE_URL
        value: https://mbpvfilblwuayldznsev.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STAFF_USERNAME
        value: driver
      - key: STAFF_PASSWORD_HASH
        sync: false
